[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h9s-mlb-2026-playoffs"
version = "0.1.0"
description = "FastAPI service for MLB playoff ingestion, merge, and HTML reporting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1,<1.0",
  "uvicorn[standard]>=0.35.0,<1.0",
  "httpx>=0.28.1,<1.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.10.1",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
